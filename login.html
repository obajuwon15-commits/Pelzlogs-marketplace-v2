<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login - Pelz Logs</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }body { background: #050714; display: grid; place-items: center; height: 100vh; color: #fff; position: relative; overflow: hidden; }.bg-circle { position: absolute; border-radius: 50%; filter: blur(80px); z-index: 0; }.circle1 { width: 300px; height: 300px; background: rgba(139, 92, 246, 0.3); top: 10%; left: 10%; }.circle2 { width: 200px; height: 200px; background: rgba(59, 130, 246, 0.2); bottom: 10%; right: 15%; } form { background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(12px); padding: 40px; border-radius: 16px; width: 350px; border: 1px solid rgba(255,255,255,0.1); z-index: 10; box-shadow: 0 0 30px rgba(59, 130, 246, 0.2); } h2 { color: white; text-align: center; margin-bottom: 30px; font-size: 1.8rem; cursor: pointer; user-select: none; }.input-group { position: relative; margin: 30px 0; }.input-group input { width: 100%; padding: 10px 0; background: none; border: none; border-bottom: 2px solid #475569; color: white; outline: none; font-size: 16px; }.input-group label { position: absolute; top: 10px; left: 0; color: #94a3b8; pointer-events: none; transition: 0.3s; }.input-group input:focus ~ label,.input-group input:valid ~ label { top: -15px; font-size: 12px; color: #8b5cf6; }.input-group input:focus { border-bottom: 2px solid #8b5cf6; }.options { display: flex; justify-content: space-between; align-items: center; margin: 20px 0; font-size: 14px; }.options label { display: flex; align-items: center; gap: 8px; color: #cbd5e1; cursor: pointer; }.options input[type="checkbox"] { accent-color: #8b5cf6; }.options a { color: #3b82f6; text-decoration: none; } button { width: 100%; padding: 14px; background: linear-gradient(90deg, #3b82f6 0%, #8b5cf6 100%); border: none; border-radius: 50px; color: white; font-weight: 600; font-size: 16px; cursor: pointer; margin-top: 10px; transition: 0.3s; } button:disabled{opacity:0.6;cursor:not-allowed}.register-link { text-align: center; margin-top: 25px; color: #94a3b8; font-size: 14px; }.register-link a { color: #3b82f6; text-decoration: none; font-weight: 600; }.alert { background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #ef4444; padding: 12px; border-radius: 8px; margin-bottom: 20px; text-align: center; display: none; }.success { background: rgba(34, 197, 94, 0.2); border: 1px solid #22c55e; color: #22c55e; }</style>
</head><body><div class="bg-circle circle1"></div><div class="bg-circle circle2"></div>
<form onsubmit="loginUser(event)"><h2 id="secretLogo">Welcome Back</h2><div class="alert" id="alertBox"></div>
<div class="input-group"><input type="text" id="username" required><label>Username</label></div>
<div class="input-group"><input type="password" id="password" required><label>Password</label></div>
<div class="options"><a href="forgot.html">Forgot Password?</a><label><input type="checkbox" id="remember"> Remember Me</label></div>
<button type="submit" id="loginBtn">Sign In</button><p class="register-link">Don't have an account? <a href="signup.html">Register</a></p></form>
<script>
const SUPABASE_URL = "https://tubhdumzucdephfvzaju.supabase.co"; // PUT YOUR URL HERE
const SUPABASE_ANON = "sb_publishable_DWEhhCXBjLZUH9mpWZUAkg_z-vRgm4U"; // PUT YOUR ANON KEY HERE
const supaClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

let clickCount = 0; let clickTimer = null;
document.getElementById('secretLogo').addEventListener('click', () => {
  clickCount++; clearTimeout(clickTimer);
  clickTimer = setTimeout(() => { clickCount = 0; }, 800);
  if(clickCount === 3){ clickCount = 0; window.location.href = 'admin.html'; }
});

async function loginUser(e){
  e.preventDefault();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value; // FIXED BUG: was.h()
  const remember = document.getElementById('remember').checked;
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = 'Signing in...';

  const {data, error} = await supaClient.from('users').select('*').eq('username', username).eq('password', password).single();
  if(error ||!data){
    showAlert('Invalid Username or Password');
    btn.disabled=false; btn.textContent='Sign In'; return;
  }
  localStorage.setItem('pelzlogsUser', data.username);
  localStorage.setItem('pelzlogsEmail', data.email);
  if(remember){localStorage.setItem('pelzlogsRemember', data.username);}
  showAlert('Login Successful!', true);
  setTimeout(()=> window.location.href = 'dashboard.html', 1000);
}
function showAlert(msg, success = false){ const a = document.getElementById('alertBox'); a.textContent = msg; a.className = success? 'alert success' : 'alert'; a.style.display = 'block'; setTimeout(()=>a.style.display='none', 3000); }
if(localStorage.getItem('pelzlogsRemember')){document.getElementById('username').value = localStorage.getItem('pelzlogsRemember');document.getElementById('remember').checked = true;}
</script></body></html>
