<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sign Up - Pelz Logs</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}body{background:#050714;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;position:relative}.bg-circle{position:absolute;border-radius:50%;filter:blur(80px);z-index:0}.circle1{width:300px;height:300px;background:rgba(139,92,246,0.3);top:10%;left:10%}.circle2{width:200px;height:200px;background:rgba(59,130,246,0.2);bottom:10%;right:15%}.login-container{background:rgba(30,41,59,0.6);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.1);padding:40px;border-radius:16px;width:90%;max-width:400px;z-index:10;box-shadow:0 0 30px rgba(59,130,246,0.2)}.logo{text-align:center;color:#3b82f6;font-size:2rem;font-weight:700;margin-bottom:10px}.subtitle{text-align:center;color:#94a3b8;margin-bottom:30px}.input-group{margin-bottom:20px}.input-group label{display:block;margin-bottom:8px;color:#94a3b8;font-size:14px}.input-group input{width:100%;padding:12px 15px;background:rgba(15,23,42,0.5);border:1px solid #475569;border-radius:10px;color:white;outline:none}.input-group input:focus{border-color:#8b5cf6}.login-btn{width:100%;padding:14px;background:linear-gradient(90deg,#3b82f6 0%,#8b5cf6 100%);border:none;border-radius:50px;color:white;font-weight:600;cursor:pointer;font-size:16px}.signup-link{text-align:center;margin-top:20px;color:#94a3b8}.signup-link a{color:#3b82f6;text-decoration:none}.alert{position:fixed;top:20px;right:20px;background:rgba(34,197,94,0.9);padding:15px 20px;border-radius:10px;z-index:9999;display:none}</style>
</head><body><div class="bg-circle circle1"></div><div class="bg-circle circle2"></div><div class="alert" id="alertBox"></div>
<div class="login-container"><div class="logo">PELZ LOGS</div><p class="subtitle">Create your account</p>
<div class="input-group"><label>Username</label><input type="text" id="username" placeholder="Choose username"></div>
<div class="input-group"><label>Email</label><input type="email" id="email" placeholder="your@email.com"></div>
<div class="input-group"><label>Password</label><input type="password" id="password" placeholder="Create password"></div>
<button class="login-btn" id="signupBtn" onclick="signup()">Sign Up</button>
<p class="signup-link">Already have an account? <a href="login.html">Login</a></p></div>
<script>
const SUPABASE_URL = "https://tubhdumzucdephfvzaju.supabase.co"; // PUT YOUR URL
const SUPABASE_ANON = "sb_publishable_DWEhhCXBjLZUH9mpWZUAkg_z-vRgm4U"; // PUT YOUR ANON KEY
const supaClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
function showAlert(msg){const a=document.getElementById('alertBox');a.textContent=msg;a.style.display='block';setTimeout(()=>a.style.display='none',3000)}
async function signup(){
  const u=document.getElementById('username').value.trim();
  const e=document.getElementById('email').value.trim();
  const p=document.getElementById('password').value.trim();
  const btn = document.getElementById('signupBtn');
  if(!u||!e||!p){showAlert('Fill all fields');return}
  btn.disabled = true; btn.textContent = 'Creating...';
  const {data: existing} = await supaClient.from('users').select('id').eq('username', u);
  if(existing && existing.length > 0){showAlert('Username already exists'); btn.disabled=false; btn.textContent='Sign Up'; return}
  const {error: userError} = await supaClient.from('users').insert([{username: u, email: e, password: p}]);
  if(userError){showAlert(userError.message); btn.disabled=false; btn.textContent='Sign Up'; return}
  await supaClient.from('wallets').insert([{user_email: e, balance: 0, spent: 0, deposit: 0}]);
  showAlert('Account created! Login now');
  setTimeout(()=>window.location.href='login.html',1500)
}
</script></body></html>
