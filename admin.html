<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin - Pelz Logs</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif }
body { background:#050714; color:#fff; padding:20px; min-height:100vh; position:relative; overflow-x:hidden; display:grid; place-items:center }

.bg-circle { position:absolute; border-radius:50%; filter:blur(80px); z-index:0 }
.circle1 { width:300px; height:300px; background:rgba(139,92,246,0.3); top:10%; left:10% }
.circle2 { width:200px; height:200px; background:rgba(59,130,246,0.2); bottom:10%; right:15% }

.box { background:rgba(30,41,59,0.6); backdrop-filter:blur(12px); border:1px solid rgba(255,255,255,0.1); border-radius:16px; padding:20px; box-shadow:0 0 30px rgba(59,130,246,0.2); margin-bottom:20px; z-index:10; position:relative; width:100%; max-width:650px }
.topbar { display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap }
label { font-weight:600; display:block; margin-top:10px; color:#cbd5e1; font-size:14px }
input, textarea { width:100%; padding:12px; border:1px solid #475569; border-radius:10px; margin-top:5px; background:rgba(15,23,42,0.5); color:white; font-size:14px; outline:none }
input:focus, textarea:focus { border-color:#8b5cf6 }

.btn { width:100%; padding:14px; border:none; border-radius:50px; background:linear-gradient(90deg,#3b82f6 0%,#8b5cf6 100%); color:white; font-weight:700; cursor:pointer; font-size:15px; margin-top:10px }
.btn-secondary { background:rgba(59,130,246,0.2); border:1px solid #3b82f6 }
.btn-danger { background:#ef4444 }
.btn-small { padding:8px 12px; border-radius:8px; font-size:12px; margin-right:5px; border:none; cursor:pointer; font-weight:600 }
.btn-edit { background:#3b82f6; color:white }
.btn-delete { background:#ef4444; color:white }

.stock-item { background:rgba(15,23,42,0.5); padding:12px; border-radius:10px; margin-bottom:10px; border:1px solid #475569; display:flex; gap:10px; align-items:center }
.stock-item img { width:50px; height:50px; border-radius:8px; object-fit:cover }
.tag { display:inline-block; background:rgba(59,130,246,0.2); color:#3b82f6; padding:3px 8px; border-radius:6px; font-size:11px; font-weight:600 }
.stats { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:15px }
.stat-card { background:rgba(15,23,42,0.5); padding:12px; border-radius:10px; text-align:center; border:1px solid #475569 }
.stat-card h4 { color:#94a3b8; font-size:12px }
.stat-card p { font-size:20px; font-weight:700; color:#3b82f6 }
.hidden { display:none }
.alert { background:rgba(239,68,68,0.2); border:1px solid #ef4444; color:#ef4444; padding:12px; border-radius:8px; margin-bottom:15px; text-align:center; display:none }
.actions { display:flex; gap:5px; margin-top:10px }
.info { background:rgba(59,130,246,0.1); border:1px solid #3b82f6; padding:10px; border-radius:8px; font-size:12px; margin-bottom:10px; color:#93c5fd }
.preview-img { width:100px; height:100px; border-radius:10px; object-fit:cover; margin-top:10px; border:1px solid #475569 }
</style>
</head>
<body>
<div class="bg-circle circle1"></div>
<div class="bg-circle circle2"></div>

<div class="box" id="adminLogin">
  <h2 style="text-align:center; margin-bottom:20px">Admin Login</h2>
  <div class="alert" id="adminAlert"></div>
  <label>Password</label>
  <input type="password" id="adminPass" placeholder="Enter password">
  <button class="btn" onclick="loginAdmin()">Login</button>
</div>

<div id="adminPanel" class="hidden">
  <h2>PELZ LOGS ADMIN</h2>
  <div class="topbar">
    <button class="btn btn-secondary" onclick="window.location.href='marketplace.html'">🏪 Visit Shop</button>
    <button class="btn btn-secondary" onclick="window.location.href='orders.html'">📦 View Orders</button>
    <button class="btn btn-danger" onclick="logoutAdmin()">Logout</button>
  </div>

  <div class="stats">
    <div class="stat-card"><h4>Total Products</h4><p id="totalProducts">0</p></div>
    <div class="stat-card"><h4>Total Items</h4><p id="totalItems">0</p></div>
    <div class="stat-card"><h4>Categories</h4><p id="totalCats">0</p></div>
  </div>

  <div class="box">
    <h3 id="formTitle">+ Add Product</h3>
    <input type="hidden" id="editId">

    <label>Category</label>
    <input id="cat" placeholder="FACEBOOK or GMAIL">

    <label>Product Name</label>
    <input id="pname" placeholder="FB 100-200 Friends">

    <label>Product Image</label>
    <input type="file" id="imgFile" accept="image/*" onchange="previewImage(event)">
    <img id="imgPreview" class="preview-img hidden" src="">
    <input type="hidden" id="imgUrl">
    <p id="uploadStatus" style="font-size:12px; color:#94a3b8; margin-top:5px"></p>

    <label>Description</label>
    <input id="desc" placeholder="2 Year Old | Marketplace Enabled">

    <label>Price ₦ Per Account</label>
    <input id="price" type="number" placeholder="50">

    <div class="info">
      <b>Format:</b> Link | Email | Password | Cookie
    </div>
    <label>Accounts Data - 1 account per line</label>
    <textarea id="accountsData" rows="8" placeholder="fb.com/page1 | user1@gmail.com | Pass123! | cookie123"></textarea>

    <button class="btn" id="saveBtn" onclick="saveProduct()">Submit Add</button>
    <button class="btn hidden" id="cancelBtn" onclick="cancelEdit()" style="background:#64748b">Cancel</button>
  </div>

  <div class="box">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px">
      <h3>Current Stock</h3>
      <button class="btn-small btn-danger" onclick="deleteAll()">Delete All</button>
    </div>
    <input type="text" id="search" placeholder="🔍 Search products..." onkeyup="loadStock()" style="margin-bottom:15px">
    <div id="stock"></div>
  </div>
</div>

<script>
const ADMIN_PASSWORD = "pelzadmin123";
const SUPA_URL = "https://tubhdumzucdephfvzaju.supabase.co";
const SUPA_KEY = "sb_publishable_DWEhhCXBjLZUH9mpWZUAkg_z-vRgm4U";
const supa = supabase.createClient(SUPA_URL, SUPA_KEY);

let uploadedImageUrl = "";
let isUploading = false;

function loginAdmin() {
  let pass = document.getElementById('adminPass').value;
  if(pass!== ADMIN_PASSWORD) { showAdminAlert('Wrong Password'); return; }
  sessionStorage.setItem('pelzlogsAdmin','true');
  document.getElementById('adminLogin').classList.add('hidden');
  document.getElementById('adminPanel').classList.remove('hidden');
  loadStock();
}

function logoutAdmin() {
  sessionStorage.removeItem('pelzlogsAdmin');
  document.getElementById('adminPanel').classList.add('hidden');
  document.getElementById('adminLogin').classList.remove('hidden');
}

function showAdminAlert(msg) {
  const a = document.getElementById('adminAlert');
  a.textContent = msg;
  a.style.display = 'block';
  setTimeout(()=>a.style.display='none', 3000);
}

// UPLOAD IMAGE TO SUPABASE STORAGE BUCKET 'Products'
async function previewImage(event) {
  const file = event.target.files[0];
  if(!file) return;
  if(isUploading) return;

  document.getElementById('imgPreview').src = URL.createObjectURL(file);
  document.getElementById('imgPreview').classList.remove('hidden');
  document.getElementById('uploadStatus').textContent = "Uploading...";
  isUploading = true;

  const fileName = `product-images/${Date.now()}-${file.name}`;
  const { data, error } = await supa.storage.from('Products').upload(fileName, file); // CHANGED TO Products

  if(error) { 
    alert("Image upload failed: " + error.message); 
    document.getElementById('uploadStatus').textContent = "Upload failed: " + error.message;
    isUploading = false;
    return; 
  }

  const { data: urlData } = supa.storage.from('Products').getPublicUrl(fileName); // CHANGED TO Products
  uploadedImageUrl = urlData.publicUrl;
  document.getElementById('imgUrl').value = uploadedImageUrl;
  document.getElementById('uploadStatus').textContent = "✅ Uploaded!";
  isUploading = false;
}

async function saveProduct() {
  if(isUploading) { alert("Please wait for image to finish uploading"); return; }
  if(!cat.value ||!pname.value ||!accountsData.value) { alert("Fill all fields"); return; }

  let lines = accountsData.value.split('\n').filter(x=>x.trim());
  let linksArr = [];
  let emailsArr = [];
  let passArr = [];
  let cookiesArr = [];

  lines.forEach(line => {
    let parts = line.split('|').map(s=>s.trim());
    if(parts.length >= 4) {
      linksArr.push(parts[0]);
      emailsArr.push(parts[1]);
      passArr.push(parts[2]);
      cookiesArr.push(parts[3]);
    }
  });

  if(linksArr.length === 0) { alert("Add at least 1 account"); return; }

  const productData = {
    category: cat.value.toUpperCase(),
    name: pname.value,
    image_url: uploadedImageUrl || imgUrl.value,
    description: desc.value,
    price: Number(price.value),
    links: linksArr,
    emails: emailsArr,
    passwords: passArr,
    cookies: cookiesArr
  };

  if(editId.value) {
    const {error} = await supa.from('products').update(productData).eq('id', editId.value);
    if(error) return alert(error.message);
    alert("Updated!");
  } else {
    const {error} = await supa.from('products').insert([productData]);
    if(error) return alert(error.message);
    alert("Saved!");
  }
  clearForm();
  loadStock();
}

async function editProduct(id) {
  const {data} = await supa.from('products').select('*').eq('id',id).single();
  let p = data;
  editId.value = p.id;
  cat.value = p.category;
  pname.value = p.name;
  imgUrl.value = p.image_url;
  uploadedImageUrl = p.image_url;
  if(p.image_url) {
    document.getElementById('imgPreview').src = p.image_url;
    document.getElementById('imgPreview').classList.remove('hidden');
  }
  desc.value = p.description;
  price.value = p.price;

  let rebuilt = [];
  if(p.links) p.links.forEach((link,i) => {
    rebuilt.push(link + ' | ' + (p.emails[i]||'') + ' | ' + (p.passwords[i]||'') + ' | ' + (p.cookies[i]||''))
  });
  accountsData.value = rebuilt.join('\n');

  document.getElementById('formTitle').innerText = "✏️ Edit Product";
  document.getElementById('saveBtn').innerText = "Update Product";
  document.getElementById('cancelBtn').classList.remove('hidden');
  window.scrollTo(0,0);
}

async function deleteProduct(id) {
  if(confirm("Delete?")) {
    await supa.from('products').delete().eq('id',id);
    loadStock();
  }
}

async function deleteAll() {
  if(confirm("Delete ALL?")) {
    await supa.from('products').delete().neq('id',0);
    loadStock();
  }
}

function cancelEdit() { clearForm(); }

function clearForm() {
  editId.value = "";
  cat.value = pname.value = desc.value = price.value = accountsData.value = "";
  document.getElementById('imgFile').value = "";
  document.getElementById('imgPreview').classList.add('hidden');
  document.getElementById('uploadStatus').textContent = "";
  uploadedImageUrl = "";
  document.getElementById('formTitle').innerText = "+ Add Product";
  document.getElementById('saveBtn').innerText = "Submit Add";
  document.getElementById('cancelBtn').classList.add('hidden');
}

async function loadStock() {
  const {data: products, error} = await supa.from('products').select('*');
  if(error) return stock.innerHTML = "Error: " + error.message;

  let search = document.getElementById('search').value.toLowerCase();
  let filtered = products.filter(p => p.name.toLowerCase().includes(search) || p.category.toLowerCase().includes(search));

  stock.innerHTML = "";
  if(filtered.length == 0) {
    stock.innerHTML = "<p style='color:#94a3b8'>No products</p>";
  } else {
    filtered.forEach(p => {
      let itemCount = p.links? p.links.length : 0;
      let img = p.image_url || 'https://via.placeholder.com/50/1e1e2e/3b82f6?text=PL';
      stock.innerHTML += `
        <div class="stock-item">
          <img src="${img}">
          <div>
            <span class="tag">${p.category}</span>
            <b>${p.name}</b> - ₦${p.price} - ${itemCount} items
            <div class="actions">
              <button class="btn-small btn-edit" onclick="editProduct('${p.id}')">Edit</button>
              <button class="btn-small btn-delete" onclick="deleteProduct('${p.id}')">Delete</button>
            </div>
          </div>
        </div>`;
    });
  }
  document.getElementById('totalProducts').innerText = products.length;
  document.getElementById('totalItems').innerText = products.reduce((sum,p) => sum + (p.links? p.links.length : 0), 0);
  document.getElementById('totalCats').innerText = [...new Set(products.map(p => p.category))].length;
}

if(sessionStorage.getItem('pelzlogsAdmin')) {
  document.getElementById('adminLogin').classList.add('hidden');
  document.getElementById('adminPanel').classList.remove('hidden');
  loadStock();
}

supa.channel('products').on('postgres_changes', {event:'*', schema:'public', table:'products'}, loadStock).subscribe();
</script>
</body>
</html>
