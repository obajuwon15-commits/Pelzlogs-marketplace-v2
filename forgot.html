<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password - Pelz Logs</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}body{background:#050714;color:#fff;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}.card{background:rgba(30,41,59,0.6);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:30px;width:100%;max-width:400px}.card h2{color:#3b82f6;text-align:center;margin-bottom:20px}.input-group{margin-bottom:15px}.input-group label{display:block;margin-bottom:8px;color:#94a3b8;font-size:14px}.input-group input{width:100%;padding:14px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:white;outline:none;font-size:16px}.btn{width:100%;padding:14px;background:linear-gradient(90deg,#3b82f6 0%,#8b5cf6 100%);border:none;border-radius:10px;color:white;font-weight:600;cursor:pointer;font-size:16px}.btn:hover{opacity:0.9}.btn:disabled{opacity:0.5;cursor:not-allowed}.back{text-align:center;margin-top:15px}.back a{color:#94a3b8;text-decoration:none}.alert{padding:12px;border-radius:8px;margin-bottom:15px;display:none}.alert.success{background:rgba(34,197,94,0.2);color:#22c55e;border:1px solid #22c55e}.alert.error{background:rgba(239,68,68,0.2);color:#ef4444;border:1px solid #ef4444}.password-box{background:rgba(0,0,0,0.4);padding:15px;border-radius:10px;margin-top:15px;text-align:center;display:none}.password-box h3{color:#22c55e;margin-bottom:10px}.password-box p{font-size:20px;font-weight:700;letter-spacing:2px;color:#fff}</style>
</head>
<body>
<div class="card">
  <h2><i class="fa-solid fa-key"></i> Forgot Password</h2>
  <div id="alertBox" class="alert"></div>
  <div id="formSection">
    <div class="input-group"><label>Username</label><input type="text" id="username" placeholder="Enter your username"></div>
    <div class="input-group"><label>Email</label><input type="email" id="email" placeholder="Enter your email"></div>
    <button class="btn" id="submitBtn" onclick="recoverPassword()">Show Password</button>
  </div>
  <div id="passwordSection" class="password-box">
    <h3><i class="fa-solid fa-check-circle"></i> Your Password</h3>
    <p id="showPassword"></p>
    <button class="btn" style="margin-top:15px" onclick="window.location.href='login.html'">Go to Login</button>
  </div>
  <div class="back">
    <a href="login.html"><i class="fas fa-arrow-left"></i> Back to Login</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://tubhdumzucdephfvzaju.supabase.co"; // PUT YOUR URL
const SUPABASE_ANON = "sb_publishable_DWEhhCXBjLZUH9mpWZUAkg_z-vRgm4U"; // PUT YOUR ANON KEY
const supaClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

function showAlert(msg, type){
  const a = document.getElementById('alertBox');
  a.textContent = msg;
  a.className = 'alert ' + type;
  a.style.display = 'block';
  setTimeout(() => a.style.display = 'none', 4000);
}

async function recoverPassword(){
  const username = document.getElementById('username').value.trim();
  const email = document.getElementById('email').value.trim();
  const btn = document.getElementById('submitBtn');
  
  if(!username || !email){
    showAlert('Please fill all fields', 'error');
    return;
  }
  
  const userEmail = username + '@pelzlogs.com';
  
  if(email !== userEmail){
    showAlert('Email does not match username', 'error');
    return;
  }
  
  btn.disabled = true;
  btn.textContent = 'Checking...';
  
  // CHECK SUPABASE USERS TABLE FOR PASSWORD
  let { data, error } = await supaClient.from('users').select('password').eq('email', userEmail).single();
  
  btn.disabled = false;
  btn.textContent = 'Show Password';
  
  if(error || !data){
    showAlert('User not found', 'error');
    return;
  }
  
  if(!data.password){
    showAlert('No password found. Please signup again', 'error');
    return;
  }
  
  // SHOW PASSWORD
  document.getElementById('formSection').style.display = 'none';
  document.getElementById('passwordSection').style.display = 'block';
  document.getElementById('showPassword').textContent = data.password;
  showAlert('Password found!', 'success');
}
</script>
</body>
</html>
