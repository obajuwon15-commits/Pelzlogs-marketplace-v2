<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PELZ LOGS - Marketplace</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
body{background:linear-gradient(180deg,#0a0a0a 0%, #1a0f2e 100%);color:#fff;font-family:'Segoe UI',Arial;padding:15px;min-height:100vh;padding-bottom:100px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.logo{color:#3b82f6;font-size:22px;font-weight:bold}
.telegram-btn{background:#0088cc;color:#fff;padding:8px 10px;border-radius:50%;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:18px}
.balance{background:#3d1a2a;color:#22c55e;padding:8px 15px;border-radius:20px;font-weight:bold}
.search{width:100%;padding:12px;background:#1e1e2e;border:1px solid #333;border-radius:10px;color:#fff;margin-bottom:15px}
.category{display:flex;align-items:center;gap:8px;color:#3b82f6;font-size:18px;font-weight:bold;margin:20px 0 10px}
.product-card{background:#1e1e2e;border:1px solid #333;border-radius:12px;padding:12px;margin-bottom:12px;display:flex;gap:12px}
.product-icon{width:45px;height:45px;border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;font-weight:bold;font-size:22px;transform:rotate(-5deg)}
.product-title{font-size:16px;font-weight:bold;margin:0}
.price-badge{background:#3b82f6;color:#fff;padding:4px 8px;border-radius:6px;font-size:12px;font-weight:bold;display:inline-block;margin:5px 0}
.stock-info{font-size:13px;color:#aaa;margin:5px 0}
.qty-row{display:flex;align-items:center;gap:8px;margin:8px 0}
.qty-input{width:70px;padding:6px;background:#0f172a;border:1px solid #333;color:#fff;border-radius:6px}
.item-link-row{display:flex;align-items:center;background:#0f172a;padding:8px;border-radius:6px;margin:5px 0;gap:6px}
.item-link{flex:1;font-size:12px;color:#60a5fa;word-break:break-all}
.copy-small{background:#3b82f6;border:none;color:#fff;padding:5px 8px;border-radius:5px;cursor:pointer;font-size:11px}
.buy-btn-card{width:100%;background:linear-gradient(90deg,#3b82f6,#8b5cf6);border:none;color:#fff;padding:10px;border-radius:8px;font-weight:bold;margin-top:8px;cursor:pointer}
.buy-btn-card:disabled{background:#475569;cursor:not-allowed}
.admin-badge{color:#fbbf24;font-size:12px}
.alert{position:fixed;top:20px;right:20px;background:rgba(34,197,94,0.9);padding:12px 16px;border-radius:10px;display:none;z-index:9999}
.telegram-blink{position: fixed;bottom: 90px;right: 20px;background: #0088cc;color: white;width: 55px;height: 55px;border-radius: 50%;display: flex;align-items:center;justify-content:center;font-size: 28px;z-index: 1000;text-decoration: none;box-shadow: 0 0 15px rgba(0,136,204,0.5);animation: blink 4s infinite;}
@keyframes blink{0%, 80% { opacity: 1; transform: scale(1); }85%, 90% { opacity: 0.3; transform: scale(0.9); }95%, 100% { opacity: 1; transform: scale(1); }}
.telegram-label{position: fixed;bottom: 150px;right: 15px;background: rgba(0,0,0,0.7);color: white;padding: 5px 10px;border-radius: 8px;font-size: 12px;z-index: 1000;animation: blink 4s infinite;}

/* NOTE BANNER - MATCHES BACKGROUND */
.note-banner{background:#1e1e2e;border:1px solid #333;color:#fbbf24;padding:12px 15px;border-radius:10px;font-size:13px;font-weight:600;text-align:center;margin:15px 0 20px 0}

/* COUNTDOWN POPUP */
#copyModal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);z-index:9999;align-items:center;justify-content:center}
.copy-box{background:#1e1e2e;padding:25px;border-radius:16px;text-align:center;max-width:320px;border:1px solid #333}
.copy-box h3{color:#3b82f6;margin-bottom:10px}
.copy-btn{background:linear-gradient(90deg,#3b82f6,#8b5cf6);color:white;border:none;padding:12px 20px;border-radius:8px;width:100%;cursor:pointer;font-weight:bold;font-size:15px;transition:0.3s}
.copy-btn:disabled{background:#475569;cursor:not-allowed;opacity:0.6}
</style>
</head>
<body>
<div class="alert" id="alertBox"></div>
<div class="header">
  <div class="logo">PELZ LOGS</div>
  <div style="display:flex;gap:10px;align-items:center">
    <a href="https://t.me/Pelzlogs" target="_blank" class="telegram-btn"><i class="fab fa-telegram"></i></a>
    <div class="balance" id="walletBalance">₦0</div>
  </div>
</div>
<h1>Marketplace</h1>
<input type="text" class="search" placeholder="Search products..." onkeyup="searchProducts(this.value)">

<!-- NOTE ON PAGE - NO DOTS -->
<div class="note-banner">
  Note: copy the link before purchasing
</div>

<div id="products">Loading...</div>

<a href="https://t.me/Pelzlogs" target="_blank" class="telegram-blink"><i class="fab fa-telegram"></i></a>
<div class="telegram-label">Customer Line</div>

<!-- COUNTDOWN POPUP -->
<div id="copyModal">
  <div class="copy-box">
    <i class="fas fa-exclamation-triangle" style="font-size:40px;color:#fbbf24;margin-bottom:10px"></i>
    <h3>Don't Forget To Copy The Links of the product u want to buy!</h3>
    <p style="color:#94a3b8;font-size:14px;margin:10px 0 20px 0">After payment, go to Orders page to see your accounts and copy them</p>
    <button id="continueBtn" onclick="closeModal()" class="copy-btn" disabled>Wait 14s...</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://tubhdumzucdephfvzaju.supabase.co";
const SUPABASE_ANON = "sb_publishable_DWEhhCXBjLZUH9mpWZUAkg_z-vRgm4U";
const supaClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

const userName = localStorage.getItem('pelzlogsUser');
if(!userName){ window.location.href = 'index.html'; }
const userEmail = userName + '@pelzlogs.com';

let walletData = {balance: 0, spent: 0};
let allProducts = [];
let currentBuyData = null;
let popupCountdown = null;

function showAlert(msg){ const a = document.getElementById('alertBox'); a.textContent = msg; a.style.display = 'block'; setTimeout(() => a.style.display = 'none', 3000); }
function copyText(text) { navigator.clipboard.writeText(text); showAlert("Copied: " + text); }

// ALL RED N LOGOS
function getLogo(name) {
  name = name.toLowerCase();
  if(name.includes('netflix') || name.includes('subscription') || name.includes('bundle')) return {bg:'#E50914', letter:'N', color:'#fff'};
  if(name.includes('spotify')) return {bg:'#1DB954', letter:'S', color:'#fff'};
  if(name.includes('youtube')) return {bg:'#FF0000', letter:'Y', color:'#fff'};
  if(name.includes('facebook') || name.includes('fb')) return {bg:'#1877F2', letter:'F', color:'#fff'};
  if(name.includes('instagram') || name.includes('ig')) return {bg:'linear-gradient(45deg,#F58529,#DD2A7B,#8134AF)', letter:'I', color:'#fff'};
  if(name.includes('twitter') || name.includes('x')) return {bg:'#000', letter:'X', color:'#fff'};
  if(name.includes('tiktok') || name.includes('tt')) return {bg:'#000', letter:'T', color:'#fff'};
  if(name.includes('px')) return {bg:'#FF0000', letter:'PX', color:'#fff'};
  return {bg:'#6366f1', letter:name[0].toUpperCase(), color:'#fff'};
}

function renderLogo(logoObj, size) {
  const fontSize = size === 'small'? '14px' : '22px';
  const borderRadius = size === 'small'? '6px' : '8px';
  const width = size === 'small'? '24px' : '45px';
  const height = size === 'small'? '24px' : '45px';
  const transform = size === 'small'? '' : 'transform:rotate(-5deg)';
  return `<div style="background:${logoObj.bg};width:${width};height:${height};border-radius:${borderRadius};display:flex;align-items:center;justify-content:center;color:${logoObj.color};font-size:${fontSize};font-weight:bold;${transform}">${logoObj.letter}</div>`;
}

async function loadWallet(){
  let { data } = await supaClient.from('wallets').select('*').eq('user_email', userEmail);
  walletData = data[0] || {balance: 0, spent: 0};
  document.getElementById('walletBalance').textContent = '₦' + (walletData.balance || 0).toLocaleString();
}

async function loadProducts() {
  const { data } = await supaClient.from('products').select('*').order('created_at', {ascending: false});
  allProducts = data || [];
  renderProducts(allProducts);
}

function renderProducts(data){
  let html = '';
  let currentCat = '';
  data.forEach(p => {
    const catName = p.category || p.name;
    if(catName!== currentCat){
      currentCat = catName;
      const catLogo = getLogo(catName);
      html += `<div class="category">${renderLogo(catLogo, 'small')} ${catName.toUpperCase()}</div>`;
    }
    const links = p.links || [];
    const stock = links.length;
    const logo = getLogo(p.name);

    html += `
    <div class="product-card">
      <div class="product-icon">${renderLogo(logo, 'big')}</div>
      <div style="flex:1">
        <h3 class="product-title">${p.name}</h3>
        <span class="price-badge">₦${parseFloat(p.price).toLocaleString()}</span>
        <span class="admin-badge"> 👑 Admin</span>
        <div class="stock-info">Available: ${stock}</div>
        ${stock > 0? links.slice(0,3).map((link) => {
          return `
          <div class="item-link-row">
            <i class="fas fa-lock"></i>
            <span class="item-link">${link}</span>
            <button class="copy-small" onclick="copyText('${link}')"><i class="fas fa-copy"></i></button>
          </div>`
        }).join('') : ''}
        ${stock > 0? `
          <div class="qty-row">Qty: <input type="number" value="1" min="1" max="${stock}" class="qty-input" id="qty-${p.id}"></div>
          <button class="buy-btn-card" onclick="buyWithQty(${p.id}, '${p.name}', ${p.price})">Buy Now</button>
        ` : `<button class="buy-btn-card" disabled>Out of Stock</button>`}
      </div>
    </div>`;
  });
  document.getElementById('products').innerHTML = html || 'No products yet.';
}

function searchProducts(val){
  const filtered = allProducts.filter(p => p.name.toLowerCase().includes(val.toLowerCase()));
  renderProducts(filtered);
}

// POPUP WITH 14S COUNTDOWN
function buyWithQty(productId, productName, price) {
  const qty = parseInt(document.getElementById('qty-'+productId).value);
  currentBuyData = {productId, productName, price, qty};
  document.getElementById('copyModal').style.display = 'flex';

  let timeLeft = 14;
  const btn = document.getElementById('continueBtn');

  btn.disabled = true;
  btn.textContent = `Wait ${timeLeft}s...`;

  clearInterval(popupCountdown);
  popupCountdown = setInterval(() => {
    timeLeft--;
    btn.textContent = `Wait ${timeLeft}s...`;
    if(timeLeft <= 0){
      clearInterval(popupCountdown);
      btn.disabled = false;
      btn.textContent = 'I Understand - Continue';
    }
  }, 1000);
}

function closeModal(){
  document.getElementById('copyModal').style.display = 'none';
  clearInterval(popupCountdown);
  processPurchase();
}

async function processPurchase() {
  const {productId, productName, price, qty} = currentBuyData;
  const totalPrice = qty * price;
  if(walletData.balance < totalPrice){ showAlert(`Insufficient balance`); return; }
  const { data: product } = await supaClient.from('products').select('links,emails,passwords,cookies').eq('id', productId).single();
  if(!product.links || product.links.length < qty){ showAlert('Not enough stock'); return; }
  const linksDel = product.links.slice(0, qty);
  const emailsDel = product.emails.slice(0, qty);
  const passDel = product.passwords.slice(0, qty);
  const cookiesDel = product.cookies.slice(0, qty);

  await supaClient.from('products').update({
    links: product.links.slice(qty),
    emails: product.emails.slice(qty),
    passwords: product.passwords.slice(qty),
    cookies: product.cookies.slice(qty)
  }).eq('id', productId);

  await supaClient.from('wallets').update({
    balance: walletData.balance - totalPrice,
    spent: walletData.spent + totalPrice
  }).eq('user_email', userEmail);

  for(let i=0; i<qty; i++){
    const fullSecret = `Email: ${emailsDel[i]}\nPassword: ${passDel[i]}\nCookie: ${cookiesDel[i]}`;
    await supaClient.from('orders').insert([{
      user_email: userEmail,
      product_id: productId,
      product_name: productName,
      delivered_link: fullSecret,
      price: price,
      status: 'Delivered'
    }]);
  }
  showAlert(`${qty} account(s) purchased!`);
  loadWallet();
  loadProducts();
  setTimeout(() => window.location.href = 'orders.html', 1500);
}
loadWallet();
loadProducts();
</script>
</body>
</html>
